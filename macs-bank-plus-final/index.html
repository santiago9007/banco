<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Macs Bank+</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-body">
  <div class="login-container">
    <h1 class="logo">💳 Macs Bank+</h1>
    <div class="form-card">
      <!-- Formulario Login -->
      <form id="formLogin" class="active" autocomplete="off">
        <h2>Iniciar Sesión</h2>
        <input type="text" id="usuarioLogin" placeholder="Usuario" required />
        <input type="password" id="contrasenaLogin" placeholder="Contraseña" required />
        <button type="submit" class="btn">Ingresar</button>
        <p>¿No tienes cuenta? <a href="#" onclick="UI.mostrarRegistro()">Regístrate</a></p>
        <div id="mensajeLogin" class="mensaje"></div>
      </form>

      <!-- Formulario Registro -->
      <form id="formRegister" class="hidden" autocomplete="off">
        <h2>Registro de Usuario</h2>
        <input type="text" id="nombre" placeholder="Nombre" required />
        <input type="text" id="apellido" placeholder="Apellido" required />
        <input type="text" id="email" placeholder="Correo Electrónico" required />
        <input type="number" id="telefono" placeholder="Teléfono" required />
        <input type="text" id="direccion" placeholder="Dirección" required />
        <input type="text" id="numeroIdentificacion" placeholder="Número de identificación" required />
        <input type="text" id="usuarioNuevo" placeholder="Usuario" required />
        <input type="password" id="contrasenaNueva" placeholder="Contraseña" required />
        <input type="password" id="confirmarContrasena" placeholder="Confirmar Contraseña" required />

        <div class="account-types">
          <label><input type="checkbox" id="tipoAhorros" /> Cuenta Ahorros</label>
          <label><input type="checkbox" id="tipoCorriente" /> Cuenta Corriente</label>
        </div>

        <button type="submit" class="btn">Registrar</button>
        <p>¿Ya tienes cuenta? <a href="#" onclick="UI.mostrarLogin()">Inicia sesión</a></p>
        <div id="mensajeRegistro" class="mensaje"></div>
      </form>
    </div>
  </div>

  <script src="js/classes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
